{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hackathon App</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand" href="{% url 'home' %}">QuizBank</a>
  {% if user.is_authenticated %}
  <a class="text-white" href="{% url 'question_list' %}">Questions</a>
 <a class="text-white" href="{% url 'quiz_start' %}">Take quiz</a>
 {% if user.is_staff %}<a class="text-white" href="{% url 'subject_list' %}">Subjects</a>{% endif %}
  <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2 m-0">
    {% csrf_token %}
    <span class="text-white">{{ user.username }}</span>
    <button class="btn btn-sm btn-outline-light">Logout</button>
  </form>
  {% else %}
  <div>
    <a class="btn btn-sm btn-outline-light" href="{% url 'login' %}">Login</a>
    <a class="btn btn-sm btn-light" href="{% url 'register' %}">Register</a>
  </div>
  {% endif %}
</nav>
<div class="container mt-4">
  {% for m in messages %}<div class="alert alert-success">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
